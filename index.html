<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="manifest" href="./manifest.json">
<!-- Favicon -->
<link rel="icon" href="assets/logo-192.png" type="image/x-icon" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/logo-192.png" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/logo-192.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/logo-192.png" />
<!-- Required for iOS to launch standalone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="LifeOS" />
<!-- iOS home screen icon -->
<link rel="apple-touch-icon" href="/your-repo-name/assets/logo-192.png" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <span class="brand-mark">L</span>
        <span class="brand-name">LifeOS</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Close menu">✕</button>
    </div>
    <nav class="nav" id="navList">
      <!-- nav items injected by JS -->
    </nav>
    <div class="sidebar-bottom">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <span id="themeToggleIcon">🌙</span>
        <span id="themeToggleLabel">Dark mode</span>
      </button>
      <button class="text-btn" id="openPrefs">Preferences &amp; Data</button>
    </div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
    </header>
    <div class="content" id="content">
      <!-- page content injected by JS -->
    </div>
  </main>

</div>

<div class="modal-root" id="modalRoot"></div>
<div class="toast-root" id="toastRoot"></div>

<script src="js/app.js"></script>
</body>
</html>
